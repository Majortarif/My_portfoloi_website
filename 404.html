<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found — Tariful Hoque</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#04060b" />
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500&display=swap" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <style>
    .not-found {
      display: grid;
      place-content: center;
      gap: 20px;
      min-height: 100svh;
      padding: 24px;
      text-align: center;
    }
    .not-found__code {
      font-family: var(--font-mono);
      font-size: 13px;
      letter-spacing: 0.14em;
      color: var(--accent);
    }
    .not-found h1 {
      font-size: clamp(2.25rem, 7vw, 4rem);
      font-weight: 500;
      letter-spacing: -0.04em;
      line-height: 1.05;
    }
    .not-found p {
      color: var(--text-2);
    }
    .not-found .btn {
      justify-self: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <main class="not-found">
    <p class="not-found__code">ERROR 404</p>
    <h1>This page does not exist.</h1>
    <p>The link may be broken or the page may have moved.</p>
    <a class="btn btn--primary" href="/"><span class="btn__label">Back to the portfolio</span></a>
  </main>
</body>
</html>
